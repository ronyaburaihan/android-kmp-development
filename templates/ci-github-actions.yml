# Template: GitHub Actions for an Android + KMP repository.
# Valid YAML; NOT executed on a hosted runner as part of this skill's verification.
# Fill <placeholders>; delete jobs the project does not need. See references/quality/ci-pipeline.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '<jdk>' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck detekt lintRelease --no-daemon --console=plain

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '<jdk>' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :<shared>:jvmTest testDebugUnitTest compileKotlinMetadata --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-reports, path: '**/build/reports/tests/**' }

  ios:
    runs-on: macos-latest        # the job most KMP pipelines are missing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '<jdk>' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew :<shared>:compileKotlinIosArm64 :<shared>:iosSimulatorArm64Test :<shared>:linkDebugFrameworkIosSimulatorArm64 --no-daemon --console=plain
      - name: Swift smoke compile against the exported framework
        run: |
          xcrun swiftc -target arm64-apple-ios15.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -F <shared>/build/bin/iosSimulatorArm64/debugFramework \
            -parse-as-library -emit-object -o /tmp/smoke.o ci/SharedApiSmoke.swift

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '<jdk>' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:bundleRelease --no-daemon --console=plain
      - name: Merged release manifest must not be debuggable
        run: '! grep -q "android:debuggable=\"true\"" app/build/intermediates/merged_manifests/release/AndroidManifest.xml'
      - uses: actions/upload-artifact@v4
        with:
          name: release-artefacts
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt

  instrumented:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'instrumented')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '<jdk>' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules && sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          script: ./gradlew :app:connectedBenchmarkAndroidTest --no-daemon --console=plain   # the MINIFIED variant

  benchmark:
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, physical-device]
    steps:
      - uses: actions/checkout@v4
      - run: ./gradlew :macrobenchmark:connectedCheck --no-daemon --console=plain
